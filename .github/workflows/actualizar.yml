name: Actualizar Base de Datos de Marcas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear archivo de credenciales de Google
      run: echo '${{ secrets.GCP_CREDENTIALS }}' > credenciales.json

    - name: Ejecutar script para generar marcas.json
      run: python procesar_pdfs.py

    - name: Publicar marcas.json en GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: marcas.json
        tag_name: ultima_actualizacion
        name: "Última Actualización de Marcas"
        body: "Archivo marcas.json generado automáticamente."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Preparar carpeta de despliegue
      run: |
        mkdir public
        cp index.html public/

    - name: Instalar Wrangler
      run: npm install -g wrangler@3.90.0

    - name: Desplegar en Cloudflare Pages (con limpieza de credenciales)
      run: |
        # Limpiamos saltos de línea y espacios en blanco de los secretos
        export CLEAN_API_TOKEN=$(echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | tr -d '\n\r ')
        export CLEAN_ACCOUNT_ID=$(echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | tr -d '\n\r ')
        
        # Ejecutamos el despliegue usando las variables limpias
        CLOUDFLARE_API_TOKEN="$CLEAN_API_TOKEN" \
        CLOUDFLARE_ACCOUNT_ID="$CLEAN_ACCOUNT_ID" \
        wrangler pages deploy public --project-name=franning-buscador-marcas
